name: Release

on:
  push:
    tags:
      - "latest"
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            xvfb \
            xauth \
            libgl1 \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libgbm1 \
            mesa-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Regenerate README screenshot (Linux headless)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s xvfb-run -a -s "-screen 0 1920x1080x24" \
            env WINIT_UNIX_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe RUST_LOG=info RUST_BACKTRACE=1 \
            ./target/release/pipe_wrench --screenshot docs/screenshots/dark-mode.png
          if [ ! -s docs/screenshots/dark-mode.png ]; then
            echo "Failed to generate docs/screenshots/dark-mode.png" >&2
            exit 1
          fi
          if ! git diff --quiet docs/screenshots/dark-mode.png; then
            TMP_SHOT="$(mktemp /tmp/dark-mode.XXXXXX.png)"
            cp docs/screenshots/dark-mode.png "${TMP_SHOT}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout -B main origin/main
            cp "${TMP_SHOT}" docs/screenshots/dark-mode.png
            if ! git diff --quiet docs/screenshots/dark-mode.png; then
              git add docs/screenshots/dark-mode.png
              git commit -m "docs: update README screenshot for ${{ github.ref_name }} [skip ci]"
              git push origin main
            fi
            git checkout --force "${{ github.sha }}"
          fi

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $tag = "${{ github.ref_name }}"
          $stage = "pipe_wrench-$tag-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/pipe_wrench.exe" "$stage/"
          Copy-Item "target/release/pipe_wrench_cli.exe" "$stage/"
          Copy-Item "README.md" "$stage/"
          Copy-Item "LICENSE" "$stage/"
          Compress-Archive -Path "$stage" -DestinationPath "$stage.${{ matrix.archive_ext }}" -Force

      - name: Package release archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          STAGE="pipe_wrench-${TAG}-${{ matrix.platform }}"
          mkdir -p "${STAGE}"
          cp target/release/pipe_wrench "${STAGE}/"
          cp target/release/pipe_wrench_cli "${STAGE}/"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "${STAGE}.${{ matrix.archive_ext }}" "${STAGE}"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: pipe_wrench-${{ matrix.platform }}
          path: pipe_wrench-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release archives
        run: ls -lh dist

      - name: Upload release assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pipe_wrench-${{ github.ref_name }}-windows-x86_64.zip
            dist/pipe_wrench-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
          make_latest: true
