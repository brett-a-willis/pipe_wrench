[workspace]
members = [
    "crates/hl7-core",
    "crates/hl7-net",
    "crates/pipe_wrench_cli",
    "crates/pipe_wrench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Brett Willis"]
readme = "README.md"
keywords = ["hl7", "hl7v2", "healthcare", "mllp", "cli"]
categories = ["command-line-utilities", "gui"]

[workspace.dependencies]
hl7-core = { path = "crates/hl7-core" }
hl7-net = { path = "crates/hl7-net" }
thiserror = "2"
anyhow = "1"
memchr = "2"
encoding_rs = "0.8"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
toml = "0.8"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
arboard = "3"
png = "0.18"
rfd = "0.15"
directories = "6"
walkdir = "2"
globset = "0.4"
regex = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
